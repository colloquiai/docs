openapi: 3.0.3
info:
  title: Colloqui API Documentation
  description: API documentation for Colloqui application
  version: 1.0.0
servers:
- url: https://dashboard.colloqui.ai
tags:
- name: Authentication
  description: '

    APIs for retrieving a token and invalidating the current token.'
- name: API Keys
  description: '

    APIs for managing API keys.'
- name: Agent
  description: '

    APIs for agents'
- name: Agent Versions
  description: '

    APIs for retrieving version history of an agent.'
- name: Call History
  description: '

    APIs for managing call histories.'
- name: Guardrails
  description: '

    APIs for managing workspace guardrails.'
- name: Knowledge Base
  description: '

    APIs for knowledge base management.'
- name: Number
  description: '

    APIs for managing numbers.'
- name: Subscription
  description: '

    APIs to subscribe an agent to a subscription.'
- name: User
  description: '

    APIs for managing users.'
- name: Webhook
  description: '

    APIs for managing webhooks.'
- name: Workspace
  description: '

    APIs for managing workspaces.'
- name: Workspace User
  description: '

    APIs for managing users within workspaces.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: Bearer token authentication
security:
- default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: Retrieves a token given a valid user email and password.
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 881
                    name: architecto eius factory token
                    token: null
                    created_at: '2026-10-26T01:24:41.000000Z'
                    expires_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 881
                      name:
                        type: string
                        example: architecto eius factory token
                      token:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-10-26T01:24:41.000000Z'
                      expires_at:
                        type: string
                        example: null
                        nullable: true
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 429
                    name: my-api-key
                    token: null
                    created_at: '2026-05-01T06:37:59.000000Z'
                    expires_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 429
                      name:
                        type: string
                        example: architecto eius factory token
                      token:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-05-01T06:37:59.000000Z'
                      expires_at:
                        type: string
                        example: null
                        nullable: true
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address for your account. Must be a valid email address.
                  example: test@example.com
                password:
                  type: string
                  description: Password for your account.
                  example: 5m2gM20451lC0!
                workspace_id:
                  type: string
                  description: Workspace ID for your account.
                  example: 01kfy63vz7v5w25nk0xa3xsj5g
              required:
              - email
              - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: Revokes the current user's API token.
      parameters: []
      responses:
        204:
          description: No Content
      tags:
      - Authentication
  /api/v1/api-keys:
    get:
      summary: List API Keys
      operationId: listAPIKeys
      description: 'Retrieves a paginated list of API keys (personal access tokens) for the authenticated user.

        The tokens are returned using cursor-based pagination.'
      parameters:
      - in: query
        name: per_page
        description: The number of items per page. Must be at least 1. Must not be greater than 100.
        example: 25
        required: false
        schema:
          type: integer
          description: The number of items per page. Must be at least 1. Must not be greater than 100.
          example: 25
      - in: query
        name: cursor
        description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor from the response.
        example: architecto
        required: false
        schema:
          type: string
          description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor from the response.
          example: architecto
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - id: 882
                    name: eius et factory token
                    token: null
                    created_at: '2026-10-26T01:24:41.000000Z'
                    expires_at: null
                  - id: 883
                    name: mollitia modi factory token
                    token: null
                    created_at: '2026-10-26T01:24:41.000000Z'
                    expires_at: null
                  meta:
                    per_page: 20
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                    - id: 882
                      name: eius et factory token
                      token: null
                      created_at: '2026-10-26T01:24:41.000000Z'
                      expires_at: null
                    - id: 883
                      name: mollitia modi factory token
                      token: null
                      created_at: '2026-10-26T01:24:41.000000Z'
                      expires_at: null
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 882
                        name:
                          type: string
                          example: eius et factory token
                        token:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-10-26T01:24:41.000000Z'
                        expires_at:
                          type: string
                          example: null
                          nullable: true
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 20
                      next_cursor:
                        type: string
                        example: null
                        nullable: true
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
      tags:
      - API Keys
    post:
      summary: Create API Key
      operationId: createAPIKey
      description: Creates a new API key (personal access token) for the authenticated user.
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 884
                    name: eius et factory token
                    token: null
                    created_at: '2026-10-26T01:24:42.000000Z'
                    expires_at: null
                  token: 1|kfhex67Y19kDP1ZR7RZE0ejnbCfTDJg90UETediObe97b7b7
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 884
                      name:
                        type: string
                        example: eius et factory token
                      token:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-10-26T01:24:42.000000Z'
                      expires_at:
                        type: string
                        example: null
                        nullable: true
                  token:
                    type: string
                    example: 1|kfhex67Y19kDP1ZR7RZE0ejnbCfTDJg90UETediObe97b7b7
      tags:
      - API Keys
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                expiration:
                  type: string
                  description: The date and time when the API key will no longer be valid. Must be a valid date. Must be a date after <code>now</code>.
                  example: '2027-10-26'
  /api/v1/api-keys/{id}:
    delete:
      summary: Revoke Specific Key
      operationId: revokeSpecificKey
      description: Revokes a specific API token by its ID for the authenticated user.
      parameters: []
      responses:
        204:
          description: No Content
      tags:
      - API Keys
    parameters:
    - in: path
      name: id
      description: The ID of the api key.
      example: architecto
      required: true
      schema:
        type: string
  /api/v1/agents:
    get:
      summary: List Agents
      operationId: listAgents
      description: 'Retrieves a paginated list of agents for the authenticated user''s current workspace.

        The agents are returned using cursor-based pagination.'
      parameters:
      - in: query
        name: per_page
        description: The number of items per page. Must be at least 1. Must not be greater than 100.
        example: 25
        required: false
        schema:
          type: integer
          description: The number of items per page. Must be at least 1. Must not be greater than 100.
          example: 25
      - in: query
        name: cursor
        description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor from the response.
        example: architecto
        required: false
        schema:
          type: string
          description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor from the response.
          example: architecto
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - id: 01m5twynmge3ybky2znfrwy2wf
                    name: Ms. Elisabeth Okuneva
                    status: draft
                    agent_type: single_prompt
                    voice: ''
                    numbers: []
                    has_knowledge_bases: false
                    subscription: null
                    created_at: '2026-10-26T01:24:44.000000Z'
                    updated_at: '2026-10-26T01:24:44.000000Z'
                    published_at: null
                    workspace_id: 01m5twynkzcgr71yzw79yek8hb
                  - id: 01m5twynp1vg2pskdfpt1f852g
                    name: Miss Jazlyn Keebler III
                    status: draft
                    agent_type: single_prompt
                    voice: ''
                    numbers: []
                    has_knowledge_bases: false
                    subscription: null
                    created_at: '2026-10-26T01:24:44.000000Z'
                    updated_at: '2026-10-26T01:24:44.000000Z'
                    published_at: null
                    workspace_id: 01m5twynnj6vhvcmgbz23zbq3j
                  meta:
                    per_page: 20
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                    - id: 01m5twynmge3ybky2znfrwy2wf
                      name: Ms. Elisabeth Okuneva
                      status: draft
                      agent_type: single_prompt
                      voice: ''
                      numbers: []
                      has_knowledge_bases: false
                      subscription: null
                      created_at: '2026-10-26T01:24:44.000000Z'
                      updated_at: '2026-10-26T01:24:44.000000Z'
                      published_at: null
                      workspace_id: 01m5twynkzcgr71yzw79yek8hb
                    - id: 01m5twynp1vg2pskdfpt1f852g
                      name: Miss Jazlyn Keebler III
                      status: draft
                      agent_type: single_prompt
                      voice: ''
                      numbers: []
                      has_knowledge_bases: false
                      subscription: null
                      created_at: '2026-10-26T01:24:44.000000Z'
                      updated_at: '2026-10-26T01:24:44.000000Z'
                      published_at: null
                      workspace_id: 01m5twynnj6vhvcmgbz23zbq3j
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01m5twynmge3ybky2znfrwy2wf
                        name:
                          type: string
                          example: Ms. Elisabeth Okuneva
                        status:
                          type: string
                          example: draft
                        agent_type:
                          type: string
                          example: single_prompt
                        voice:
                          type: string
                          example: ''
                        numbers:
                          type: array
                          example: []
                        has_knowledge_bases:
                          type: boolean
                          example: false
                        subscription:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-10-26T01:24:44.000000Z'
                        updated_at:
                          type: string
                          example: '2026-10-26T01:24:44.000000Z'
                        published_at:
                          type: string
                          example: null
                          nullable: true
                        workspace_id:
                          type: string
                          example: 01m5twynkzcgr71yzw79yek8hb
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 20
                      next_cursor:
                        type: string
                        example: null
                        nullable: true
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
      tags:
      - Agent
    post:
      summary: Create Agent
      operationId: createAgent
      description: Create a new agent
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    version: null
                    numbers: []
                    id: 01m5twynv2f8eycseqacz0fbby
                    name: Ms. Elisabeth Okuneva
                    status: draft
                    timezone: null
                    call_config:
                      max_call_duration_ms: 2108804
                      ring_duration_ms: 35396
                      recording_enabled: false
                    llm_config:
                      temperature: 0.22
                      provider: groq
                      source: null
                      model: llama2-70b-4096
                      knowledge_base_ids: []
                      tools: []
                    prompt_config:
                      prompt: 'Et consequatur aut dolores enim. Facere tempora ex voluptatem laboriosam. Quis adipisci molestias fugit deleniti distinctio eum. Id aut libero aliquam veniam. Dolorem mollitia deleniti nemo.


                        Officia est dignissimos neque blanditiis odio veritatis excepturi. Delectus fugit qui repudiandae laboriosam. Alias tenetur ratione nemo voluptate accusamus ut et.


                        Rerum ex repellendus assumenda et. Ab reiciendis quia perspiciatis deserunt ducimus corrupti. Dolores quia maiores assumenda odit doloribus repellat officiis. Nesciunt ut ratione iure impedit molestiae ut rem.'
                      first_speaker: ai
                      ai_speak_after_silence: false
                      ai_speak_wait_time: 4
                      welcome_message_type: dynamic
                      welcome_message: null
                    stt_config:
                      model: universal-streaming-english
                      provider: assemblyai
                      automatic_keyterm_detection: false
                      responsiveness: 1
                      interruption_sensitivity: 1
                    tts_config:
                      voice_id: 5601c8f4-9fee-3c15-b93d-e34b88b648fd
                      streaming_latency: 3
                      speed_alpha: null
                      provider: elevenlabs
                      model: eleven_monolingual_v1
                      ambient_sound_volume: 1
                      enable_backchannel: true
                      backchannel_frequency: 0.8
                      reminder_trigger_ms: 10000
                    workspace_id: 01m5twyntf57vc6qn62m960vbx
                    created_at: '2026-10-26T01:24:45+00:00'
                    updated_at: '2026-10-26T01:24:45+00:00'
                    published_at: null
                    guardrails_config:
                      guardrails: []
                      semantic_guardrail: true
                properties:
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        example: null
                        nullable: true
                      numbers:
                        type: array
                        example: []
                      id:
                        type: string
                        example: 01m5twynv2f8eycseqacz0fbby
                      name:
                        type: string
                        example: Ms. Elisabeth Okuneva
                      status:
                        type: string
                        example: draft
                      timezone:
                        type: string
                        example: null
                        nullable: true
                      call_config:
                        type: object
                        properties:
                          max_call_duration_ms:
                            type: integer
                            example: 2108804
                          ring_duration_ms:
                            type: integer
                            example: 35396
                          recording_enabled:
                            type: boolean
                            example: false
                      llm_config:
                        type: object
                        properties:
                          temperature:
                            type: number
                            example: 0.22
                          provider:
                            type: string
                            example: groq
                          source:
                            type: string
                            example: null
                            nullable: true
                          model:
                            type: string
                            example: llama2-70b-4096
                          knowledge_base_ids:
                            type: array
                            example: []
                          tools:
                            type: array
                            example: []
                      prompt_config:
                        type: object
                        properties:
                          prompt:
                            type: string
                            example: 'Et consequatur aut dolores enim. Facere tempora ex voluptatem laboriosam. Quis adipisci molestias fugit deleniti distinctio eum. Id aut libero aliquam veniam. Dolorem mollitia deleniti nemo.


                              Officia est dignissimos neque blanditiis odio veritatis excepturi. Delectus fugit qui repudiandae laboriosam. Alias tenetur ratione nemo voluptate accusamus ut et.


                              Rerum ex repellendus assumenda et. Ab reiciendis quia perspiciatis deserunt ducimus corrupti. Dolores quia maiores assumenda odit doloribus repellat officiis. Nesciunt ut ratione iure impedit molestiae ut rem.'
                          first_speaker:
                            type: string
                            example: ai
                          ai_speak_after_silence:
                            type: boolean
                            example: false
                          ai_speak_wait_time:
                            type: integer
                            example: 4
                          welcome_message_type:
                            type: string
                            example: dynamic
                          welcome_message:
                            type: string
                            example: null
                            nullable: true
                      stt_config:
                        type: object
                        properties:
                          model:
                            type: string
                            example: universal-streaming-english
                          provider:
                            type: string
                            example: assemblyai
                          automatic_keyterm_detection:
                            type: boolean
                            example: false
                          responsiveness:
                            type: integer
                            example: 1
                          interruption_sensitivity:
                            type: integer
                            example: 1
                      tts_config:
                        type: object
                        properties:
                          voice_id:
                            type: string
                            example: 5601c8f4-9fee-3c15-b93d-e34b88b648fd
                          streaming_latency:
                            type: integer
                            example: 3
                          speed_alpha:
                            type: string
                            example: null
                            nullable: true
                          provider:
                            type: string
                            example: elevenlabs
                          model:
                            type: string
                            example: eleven_monolingual_v1
                          ambient_sound_volume:
                            type: integer
                            example: 1
                          enable_backchannel:
                            type: boolean
                            example: true
                          backchannel_frequency:
                            type: number
                            example: 0.8
                          reminder_trigger_ms:
                            type: integer
                            example: 10000
                      workspace_id:
                        type: string
                        example: 01m5twyntf57vc6qn62m960vbx
                      created_at:
                        type: string
                        example: '2026-10-26T01:24:45+00:00'
                      updated_at:
                        type: string
                        example: '2026-10-26T01:24:45+00:00'
                      published_at:
                        type: string
                        example: null
                        nullable: true
                      guardrails_config:
                        type: object
                        properties:
                          guardrails:
                            type: array
                            example: []
                          semantic_guardrail:
                            type: boolean
                            example: true
      tags:
      - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                call_config:
                  type: object
                  description: ''
                  example: []
                  properties:
                    max_call_duration_ms:
                      type: integer
                      description: Maximum call duration in milliseconds. Must be at least 60000. Must not be greater than 7200000.
                      example: 3600000
                    ring_duration_ms:
                      type: integer
                      description: Ring duration in milliseconds before call is considered unanswered. Must be at least 5000. Must not be greater than 300000.
                      example: 30000
                    recording_enabled:
                      type: boolean
                      description: Whether call recording is enabled.
                      example: true
                guardrails_config:
                  type: object
                  description: Object holding the guardrails configuration of the agent.
                  example:
                    guardrails: []
                    semantic_guardrail: true
                  properties:
                    semantic_guardrail:
                      type: boolean
                      description: Whether semantic guardrails are enabled for the agent. Defaults to true.
                      example: true
                    guardrails:
                      type: array
                      description: Array of guardrails to link to the agent.
                      example: []
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The <code>id</code> of an existing record in the guardrails table.
                            example: architecto
                          source:
                            type: array
                            description: ''
                            example:
                            - architecto
                            items:
                              type: string
                              enum:
                              - input
                              - output
                        required:
                        - id
                knowledge_base_config:
                  type: object
                  description: ''
                  example: []
                  properties:
                    chunks_to_retrieve:
                      type: integer
                      description: Number of knowledge base chunks to retrieve (1-10). Must be at least 1. Must not be greater than 10.
                      example: 5
                    similarity_threshold:
                      type: number
                      description: Similarity threshold for knowledge base retrieval (0.30-0.95). Must be at least 0.30. Must not be greater than 0.95.
                      example: 0.75
                      nullable: true
                llm_config:
                  type: object
                  description: ''
                  example: []
                  properties:
                    provider:
                      type: string
                      description: The <code>key</code> of an existing record in the llm_config_providers table.
                      example: architecto
                    source:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    model:
                      type: string
                      description: The model name to use according to the llm_config.provider.
                      example: gpt-4o-mini
                    temperature:
                      type: number
                      description: Controls creativity or randomness in the model's responses. This field is required when <code>llm_config.provider</code> is <code>bedrock_claude</code>. This field is required when <code>llm_config.provider</code> is <code>custom</code>. Must be at least 0. Must not be greater than 1.
                      example: 1
                    region:
                      type: string
                      description: The AWS region where the Bedrock service is hosted. This field is required when <code>llm_config.provider</code> is <code>bedrock_claude</code>.
                      example: us-east-1
                    max_tokens:
                      type: integer
                      description: The maximum number of tokens (words/pieces of words) that the model can generate in its response. This field is required when <code>llm_config.provider</code> is <code>bedrock_claude</code>.
                      example: 16
                    base_url:
                      type: string
                      description: ''
                      example: null
                    api_key:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    deployment:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    endpoint:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    api_version:
                      type: string
                      description: ''
                      example: architecto
                      nullable: true
                    knowledge_base_ids:
                      type: array
                      description: The <code>id</code> of an existing record in the knowledge_bases table.
                      example:
                      - architecto
                      items:
                        type: string
                    tools:
                      type: array
                      description: Array of tool configurations.
                      example: null
                      items:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                            description: Must match the regex /^[a-zA-Z_-][a-zA-Z0-9_-]*$/. Must not be greater than 255 characters.
                            example: n
                          description:
                            type: string
                            description: Must not be greater than 1024 characters.
                            example: Animi quos velit et fugiat.
                            nullable: true
                          type:
                            type: string
                            description: ''
                            example: extract_dynamic_variable
                            enum:
                            - end_call
                            - transfer_call
                            - press_ivr
                            - send_sms
                            - extract_dynamic_variable
                            - custom_function
                          goodbye_type:
                            type: string
                            description: ''
                            example: prompt
                            enum:
                            - static
                            - prompt
                            nullable: true
                          goodbye_message:
                            type: string
                            description: Must not be greater than 1000 characters.
                            example: d
                            nullable: true
                          goodbye_prompt:
                            type: string
                            description: ''
                            example: architecto
                            nullable: true
                          announcement_type:
                            type: string
                            description: ''
                            example: prompt
                            enum:
                            - static
                            - prompt
                            nullable: true
                          announcement_message:
                            type: string

openapi: 3.0.3
info:
  title: Colloqui API Documentation
  description: API documentation for Colloqui application
  version: 1.0.0
servers:
- url: https://colloqui-web-develop-btoadh.laravel.cloud
tags:
- name: Authentication
  description: '

    APIs for retrieving a token and invalidating the current token.'
- name: API Keys
  description: '

    APIs for managing API keys.'
- name: Agent
  description: '

    APIs for agents'
- name: Agent Versions
  description: '

    APIs for retrieving version history of an agent.'
- name: Call History
  description: '

    APIs for managing call histories.'
- name: Knowledge Base
  description: '

    APIs for knowledge base management.'
- name: Number
  description: '

    APIs for managing numbers.'
- name: Subscription
  description: '

    APIs to subscribe an agent to a subscription.'
- name: User
  description: '

    APIs for managing users.'
- name: Webhook
  description: '

    APIs for managing webhooks.'
- name: Workspace
  description: '

    APIs for managing workspaces.'
- name: Workspace User
  description: '

    APIs for managing users within workspaces.'
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: Bearer token authentication
security:
- default: []
paths:
  /api/v1/auth/login:
    post:
      summary: Login
      operationId: login
      description: Retrieves a token given a valid user email and password.
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 429
                    name: my-api-key
                    token: null
                    created_at: '2026-05-01T06:37:59.000000Z'
                    expires_at: null
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 429
                      name:
                        type: string
                        example: architecto eius factory token
                      token:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-05-01T06:37:59.000000Z'
                      expires_at:
                        type: string
                        example: null
                        nullable: true
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email address for your account. Must be a valid email
                    address.
                  example: test@example.com
                password:
                  type: string
                  description: Password for your account.
                  example: 5m2gM20451lC0!
                workspace_id:
                  type: string
                  description: Workspace ID for your account.
                  example: 01kfy63vz7v5w25nk0xa3xsj5g
              required:
              - email
              - password
      security: []
  /api/v1/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: Revokes the current user's API token.
      parameters: []
      responses:
        204:
          description: No Content
      tags:
      - Authentication
  /api/v1/api-keys:
    get:
      summary: List API Keys
      operationId: listAPIKeys
      description: 'Retrieves a paginated list of API keys (personal access tokens)
        for the authenticated user.

        The tokens are returned using cursor-based pagination.'
      parameters:
      - in: query
        name: per_page
        description: The number of items per page. Must be at least 1. Must not be
          greater than 100.
        example: 25
        required: false
        schema:
          type: integer
          description: The number of items per page. Must be at least 1. Must not
            be greater than 100.
          example: 25
      - in: query
        name: cursor
        description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor
          from the response.
        example: example
        required: false
        schema:
          type: string
          description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor
            from the response.
          example: example
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - id: 430
                    name: my-api-key
                    token: null
                    created_at: '2026-05-01T06:38:00.000000Z'
                    expires_at: null
                  - id: 431
                    name: my-api-key
                    token: null
                    created_at: '2026-05-01T06:38:00.000000Z'
                    expires_at: null
                  meta:
                    per_page: 20
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                    - id: 430
                      name: my-api-key
                      token: null
                      created_at: '2026-05-01T06:38:00.000000Z'
                      expires_at: null
                    - id: 431
                      name: my-api-key
                      token: null
                      created_at: '2026-05-01T06:38:00.000000Z'
                      expires_at: null
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 430
                        name:
                          type: string
                          example: eius et factory token
                        token:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-05-01T06:38:00.000000Z'
                        expires_at:
                          type: string
                          example: null
                          nullable: true
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 20
                      next_cursor:
                        type: string
                        example: null
                        nullable: true
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
      tags:
      - API Keys
    post:
      summary: Create API Key
      operationId: createAPIKey
      description: Creates a new API key (personal access token) for the authenticated
        user.
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 432
                    name: my-api-key
                    token: null
                    created_at: '2026-05-01T06:38:00.000000Z'
                    expires_at: null
                  token: 1|kfhex67Y19kDP1ZR7RZE0ejnbCfTDJg90UETediObe97b7b7
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 432
                      name:
                        type: string
                        example: eius et factory token
                      token:
                        type: string
                        example: null
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-05-01T06:38:00.000000Z'
                      expires_at:
                        type: string
                        example: null
                        nullable: true
                  token:
                    type: string
                    example: 1|kfhex67Y19kDP1ZR7RZE0ejnbCfTDJg90UETediObe97b7b7
      tags:
      - API Keys
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                expiration:
                  type: string
                  description: The date and time when the API key will no longer be
                    valid. Must be a valid date. Must be a date after `now`.
                  example: '2027-05-01'
  /api/v1/api-keys/{id}:
    delete:
      summary: Revoke Specific Key
      operationId: revokeSpecificKey
      description: Revokes a specific API token by its ID for the authenticated user.
      parameters: []
      responses:
        204:
          description: No Content
      tags:
      - API Keys
    parameters:
    - in: path
      name: id
      description: The ID of the api key.
      example: 01h8xyz123abc456def789ghi
      required: true
      schema:
        type: string
  /api/v1/agents:
    get:
      summary: List Agents
      operationId: listAgents
      description: 'Retrieves a paginated list of agents for the authenticated user''s
        current workspace.

        The agents are returned using cursor-based pagination.'
      parameters:
      - in: query
        name: per_page
        description: The number of items per page. Must be at least 1. Must not be
          greater than 100.
        example: 25
        required: false
        schema:
          type: integer
          description: The number of items per page. Must be at least 1. Must not
            be greater than 100.
          example: 25
      - in: query
        name: cursor
        description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor
          from the response.
        example: example
        required: false
        schema:
          type: string
          description: The cursor for pagination. Use the meta.next_cursor or meta.previous_cursor
            from the response.
          example: example
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                  - id: 01kqh44e0js9xngdb1s9rctf16
                    name: My Agent
                    status: draft
                    voice: ''
                    numbers: []
                    subscription: null
                    created_at: '2026-05-01T06:38:03.000000Z'
                    updated_at: '2026-05-01T06:38:03.000000Z'
                    published_at: null
                    workspace_id: 01kqh44e043p6nea6edbck7cy2
                  - id: 01kqh44e1rsa3ycq33h3ks3ky7
                    name: My Agent
                    status: draft
                    voice: ''
                    numbers: []
                    subscription: null
                    created_at: '2026-05-01T06:38:03.000000Z'
                    updated_at: '2026-05-01T06:38:03.000000Z'
                    published_at: null
                    workspace_id: 01kqh44e1b3tz41xev6hp1rxjq
                  meta:
                    per_page: 20
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                    - id: 01kqh44e0js9xngdb1s9rctf16
                      name: My Agent
                      status: draft
                      voice: ''
                      numbers: []
                      subscription: null
                      created_at: '2026-05-01T06:38:03.000000Z'
                      updated_at: '2026-05-01T06:38:03.000000Z'
                      published_at: null
                      workspace_id: 01kqh44e043p6nea6edbck7cy2
                    - id: 01kqh44e1rsa3ycq33h3ks3ky7
                      name: My Agent
                      status: draft
                      voice: ''
                      numbers: []
                      subscription: null
                      created_at: '2026-05-01T06:38:03.000000Z'
                      updated_at: '2026-05-01T06:38:03.000000Z'
                      published_at: null
                      workspace_id: 01kqh44e1b3tz41xev6hp1rxjq
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 01kqh44e0js9xngdb1s9rctf16
                        name:
                          type: string
                          example: My Agent
                        status:
                          type: string
                          example: draft
                        voice:
                          type: string
                          example: ''
                        numbers:
                          type: array
                          example: []
                        subscription:
                          type: string
                          example: null
                          nullable: true
                        created_at:
                          type: string
                          example: '2026-05-01T06:38:03.000000Z'
                        updated_at:
                          type: string
                          example: '2026-05-01T06:38:03.000000Z'
                        published_at:
                          type: string
                          example: null
                          nullable: true
                        workspace_id:
                          type: string
                          example: 01kqh44e043p6nea6edbck7cy2
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                        example: 20
                      next_cursor:
                        type: string
                        example: null
                        nullable: true
                      prev_cursor:
                        type: string
                        example: null
                        nullable: true
      tags:
      - Agent
    post:
      summary: Create Agent
      operationId: createAgent
      description: Create a new agent
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    version: null
                    numbers: []
                    id: 01kqh44e4g7ec2h7z372qvz92k
                    name: My Agent
                    status: draft
                    call_config:
                      max_call_duration_ms: 2108804
                      ring_duration_ms: 35396
                    llm_config:
                      provider: mistral
                      model: mistral-tiny
                      knowledge_base_ids: []
                      tools: []
                    prompt_config:
                      prompt: You are a helpful assistant for Acme Co. Greet the caller,
                        identify their need, and assist them politely.
                      first_speaker: ai
                      ai_speak_after_silence: false
                      ai_speak_wait_time: 4.1
                      welcome_message_type: dynamic
                      welcome_message: null
                    stt_config:
                      model: universal-streaming-english
                      provider: assemblyai
                    tts_config:
                      voice_id: 5601c8f4-9fee-3c15-b93d-e34b88b648fd
                      streaming_latency: 3
                      speed_alpha: null
                      provider: elevenlabs
                      model: eleven_monolingual_v1
                      ambient_sound_volume: 1
                      responsiveness: 1
                      interruption_sensitivity: 1
                      enable_backchannel: true
                      backchannel_frequency: 0.8
                      reminder_trigger_ms: 10000
                    workspace_id: 01kqh44e41j0whyxxxjhtvythz
                    created_at: '2026-05-01T06:38:03+00:00'
                    updated_at: '2026-05-01T06:38:03+00:00'
                    published_at: null
                properties:
                  data:
                    type: object
                    properties:
                      version:
                        type: string
                        example: null
                        nullable: true
                      numbers:
                        type: array
                        example: []
                      id:
                        type: string
                        example: 01kqh44e4g7ec2h7z372qvz92k
                      name:
                        type: string
                        example: My Agent
                      status:
                        type: string
                        example: draft
                      call_config:
                        type: object
                        properties:
                          max_call_duration_ms:
                            type: integer
                            example: 2108804
                          ring_duration_ms:
                            type: integer
                            example: 35396
                      llm_config:
                        type: object
                        properties:
                          provider:
                            type: string
                            example: mistral
                          model:
                            type: string
                            example: mistral-tiny
                          knowledge_base_ids:
                            type: array
                            example: []
                          tools:
                            type: array
                            example: []
                      prompt_config:
                        type: object
                        properties:
                          prompt:
                            type: string
                            example: Example text.
                          first_speaker:
                            type: string
                            example: ai
                          ai_speak_after_silence:
                            type: boolean
                            example: false
                          ai_speak_wait_time:
                            type: number
                            example: 4.1
                          welcome_message_type:
                            type: string
                            example: dynamic
                          welcome_message:
                            type: string
                            example: null
                            nullable: true
                      stt_config:
                        type: object
                        properties:
                          model:
                            type: string
                            example: universal-streaming-english
                          provider:
                            type: string
                            example: assemblyai
                      tts_config:
                        type: object
                        properties:
                          voice_id:
                            type: string
                            example: 5601c8f4-9fee-3c15-b93d-e34b88b648fd
                          streaming_latency:
                            type: integer
                            example: 3
                          speed_alpha:
                            type: string
                            example: null
                            nullable: true
                          provider:
                            type: string
                            example: elevenlabs
                          model:
                            type: string
                            example: eleven_monolingual_v1
                          ambient_sound_volume:
                            type: integer
                            example: 1
                          responsiveness:
                            type: integer
                            example: 1
                          interruption_sensitivity:
                            type: integer
                            example: 1
                          enable_backchannel:
                            type: boolean
                            example: true
                          backchannel_frequency:
                            type: number
                            example: 0.8
                          reminder_trigger_ms:
                            type: integer
                            example: 10000
                      workspace_id:
                        type: string
                        example: 01kqh44e41j0whyxxxjhtvythz
                      created_at:
                        type: string
                        example: '2026-05-01T06:38:03+00:00'
                      updated_at:
                        type: string
                        example: '2026-05-01T06:38:03+00:00'
                      published_at:
                        type: string
                        example: null
                        nullable: true
      tags:
      - Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Must not be greater than 255 characters.
                  example: b
                call_config:
                  type: object
                  description: ''
                  properties:
                    max_call_duration_ms:
                      type: integer
                      description: Maximum call duration in milliseconds. Must be
                        at least 60000. Must not be greater than 7200000.
                      example: 3600000
                    ring_duration_ms:
                      type: integer
                      description: Ring duration in milliseconds before call is considered
                        unanswered. Must be at least 5000. Must not be greater than
                        300000.
                      example: 30000
                knowledge_base_config:
                  type: object
                  description: ''
                  properties:
                    chunks_to_retrieve:
                      type: integer
                      description: Number of knowledge base chunks to retrieve (1-10).
                        Must be at least 1. Must not be greater than 10.
                      example: 5
                    similarity_threshold:
                      type: number
                      description: Similarity threshold for knowledge base retrieval
                        (0.30-0.95). Must be at least 0.30. Must not be greater than
                        0.95.
                      example: 0.75
                      nullable: true
                llm_config:
                  type: object
                  description: ''
                  properties:
                    provider:
                      type: string
                      description: ''
                      example: internal
                      enum:
                      - internal
                      - azure
                      - mistral
                      - bedrock_claude
                      - groq
                    model:
                      type: string
                      description: The model name to use according to the llm_config.provider.
                      example: gpt-4o-mini
                    temperature:
                      type: number
                      description: Controls creativity or randomness in the model's
                        responses. This field is required when `llm_config.provider`
                        is `bedrock_claude`. This field is required when `llm_config.provider`
                        is `internal`. Must be at least 0. Must not be greater than
                        1.
                      example: 1
                    deployment:
                      type: string
                      description: The name of the deployment you created in Azure.
                        This field is required when `llm_config.provider` is `azure`.
                      example: 01h8xyz123abc456def789ghi
                    endpoint:
                      type: string
                      description: The full endpoint URL of your Azure resource. This
                        field is required when `llm_config.provider` is `azure`. Must
                        be a valid URL.
                      example: https://my-resource-name.openai.azure.com/
                    api_version:
                      type: string
                      description: The Azure OpenAI API version to use. This field
                        is required when `llm_config.provider` is `azure`.
                      example: 2024-02-15-preview
                    base_url:
                      type: string
                      description: This field is required when `llm_config.provider`
                        is `internal`.
                      example: http://www.example.com/quos-velit-et-fugiat-sunt-nihil-accusantium-harum.html
                    api_key:
                      type: string
                      description: ''
                      example: example
                      nullable: true
                    region:
                      type: string
                      description: The AWS region where the Bedrock service is hosted.
                        This field is required when `llm_config.provider` is `bedrock_claude`.
                      example: us-east-1
                    max_tokens:
                      type: integer
                      description: The maximum number of tokens (words/pieces of words)
                        that the model can generate in its response. This field is
                        required when `llm_config.provider` is `bedrock_claude`.
                      example: 16
                    knowledge_base_ids:
                      type: array
                      description: The `id` of an existing record in the knowledge_bases
                        table.
                      example:
                      - architecto
                      items:
                        type: string
                    tools:
                      type: array
                      description: Array of tool configurations.
                      example: []
                      items:
                        type: object
                        nullable: true
                        properties:
                          name:
                            type: string
                            description: Must match the regex /^[a-zA-Z_-][a-zA-Z0-9_-]*$/.
                              Must not be greater than 255 characters.
                            example: i
                          description:
                            type: string
                            description: Must not be greater than 1024 characters.
                            example: Example text.
                            nullable: true
                          type:
                            type: string
                            description: ''
                            example: press_ivr
                            enum:
                            - end_call
                            - transfer_call
                            - press_ivr
                            - send_sms
                            - extract_dynamic_variable
                            - custom_function
                          announcement_type:
                            type: string
                            description: ''
                            example: static
                            enum:
                            - static
                            - prompt
                            nullable: true
                          announcement_message:
                            type: string
                            description: ''
                            example: example
                            nullable: true
                          announcement_prompt:
                            type: string
                            description: ''
                            example: example
                            nullable: true
                          transfer_declined_message:
                            type: string
                            description: ''
                            example: example
                            nullable: true
                          hold_audio:
                            type: string
                            description: Must not be greater than 50 characters.
                            example: n
                            nullable: true
                          custom_sip_headers:
                            type: object
                            description: 'Custom SIP headers for this tool as key-value

                              pairs, where keys are header names (e.g., "X-Foo") and
                              values are header values.'
                            example:
                              X-Foo: Foo
                              X-Bar: Bar
                            properties: {}
                          voicemail_detection:
                            type: boolean
                            description: ''
                            example: false
                            nullable: true
                          voicemail_response_action_type:
                            type: string
                            description: ''
                            example: prompt
                            enum:
                            - prompt
                            - hangup
                            - message
                            nullable: true
                          voicemail_response_text:
                            type: string
                            description: ''
                            example: example
                            nullable: true
                          phone_directory:
                            type: array
                            description: This field is required when `llm_config.tools.*.type`
                              is `transfer_call`.
                            example: []
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  description: ''
                                  example: example
                                phone_number:
                                  type: string
                                  description: ''
                                  example: example
                                description:
                                  type: string
                                  description: ''
                                  example: example
                                transfer_type:
                                  type: string
                                  description: ''
                                  example: warm
                                  enum:
                                  - warm
                                  - cold
                              required:
                              - name
                              - phone_number
                              - description
                              - transfer_type
                          pause_detection_delay_ms:
                            type: integer
                            description: Must be at least 1000. Must not be greater
                              than 6000.
                            example: 22
                            nullable: true
                          content_type:
                            type: string
                            description: This field is required when `llm_config.tools.*.type`
                              is `send_sms`.
                            example: prompt
                            enum:
                            - prompt
                            - static
                          content:
                            type: string
                            description: This field is required when `llm_config.tools.*.type`
                              is `send_sms`.
                            example: example
                          http_method:
                            type: string
                            description: This field is required when `llm_config.tools.*.http_method`
                              is `custom_function`.
                            example: PUT
                            enum:
                            - GET
                            - POST
                            - PUT
                            - PATCH
                            - DELETE
                          api_endpoint:
                            type: string
                            description: This field is required when `llm_config.tools.*.api_endpoint`
                              is `custom_function`. Must be a valid URL.
                            example: http://example.com/
                          timeout:
                            type: integer
                            description: Must be at least 0.
                            example: 77
                            nullable: true
                          custom_function_headers:
                            type: array
                            description: ''
                            example:
                            - architecto
                            items:
                              type: string
                          custom_function_query:
                            type: array
                            description: ''
                            example:
                            - architecto
                            items:
                              type: string
                          custom_function_parameters:
                            type: string
                            description: ''
                            example: example
                            nullable: true
                          custom_function_variables:
                            type: array
                            description: ''
                            example:
                            - architecto
                            items:
                              type: string
                          speak_during_execution:
                            type: boolean
                            description: ''
                            example: false
                            nullable: true
                          speak_during_execution_options:
                            type: array
                            description: ''
                            example:
                            - architecto
                            items:
                              type: string
                          speak_after_execution:
                            type: boolean
